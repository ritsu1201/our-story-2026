<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Story</title>
    <link rel="stylesheet" href="story.css" />
    <!-- css読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
    <!-- Google Fontsから指定したフォントをWebページで使えるように読み込む -->
  </head>
  <body>
    <main>
      <section class="memory">
        <p class="date">2024.08.20</p>
        <h1>THE BEGINNING</h1>
        <div class="photo zoom">
          <div class="card-1">
            <img src="../images/first-img.jpg" alt="付き合ったときの写真" />
          </div>
          <p class="photo-date">2024. 08. 27</p>
          <p class="location">📍MOKA, TOCHIGI</p>
          <p class="memory-text">
            この時はまだ付き合ったばっかりで俺の実家で上下俺の服を着ているね
          </p>
          <!-- その日の思い出 -->
        </div>
      </section>
      <section class="memory">
        <div class="profile-card card-2 zoom">
          <div class="profile-img">
            <img
              src="../images/profile-ore.jpg"
              alt="夫のプロフィール画像"
              class="ritsu"
            />
          </div>
        </div>
        <div class="profile-card card-2 zoom">
          <div class="profile-img">
            <img
              src="../images/profille.jpg"
              alt="妻のプロフィール画像"
              class="sara"
            />
          </div>
        </div>
      </section>
      <section class="memory">
        <div class="memory-card card-3 zoom">
          <img src="../images/2-img.jpg" alt="○○の写真" />
          <p class="card-date">2024.09.30</p>
          <p class="card-location">📍大平山神社</p>
          <p class="card-text">付き合って1っか月記念</p>
        </div>
      </section>
      <section class="memory">
        <div class="memory-card card-4 zoom">
          <img src="../images/二枚目.jpg" alt="○○の写真" />
          <p class="card-date">日時/場所</p>
          <p class="card-text">長めのコメント</p>
        </div>
      </section>
      <section class="memory">
        <div class="memory-card card-5">
          <img src="../images/二枚目.jpg" alt="○○の写真" />
          <div class="info-overlay">
            <p class="card-date">日付/場所</p>
            <p class="card-text">コメント</p>
          </div>
        </div>
      </section>
      <section class="memory">
        <div class="card-6">
          <div class="photo-1">
            <img src="../images/二枚目.jpg" alt="○○の写真" />
          </div>
          <p class="photo1-text">コメント</p>
          <div class="photo-2">
            <img src="../images/二枚目.jpg" alt="○○の写真" />
          </div>
          <p class="photo2-text">コメント</p>
          <div class="photo-3">
            <img src="../images/二枚目.jpg" alt="○○の写真" />
          </div>
          <p class="photo3-text">コメント</p>
        </div>
      </section>
    </main>
  </body>
</html>
