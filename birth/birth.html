<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIRTH | Our Story</title>
    <link rel="stylesheet" href="birth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"

  <body>
    <main class="birth">
      <div class="birth-content">
        <div class="and-then">AND THEN...</div>

        <div class="counter">

          <div class="labels">
            <span>HOURS</span>
            <span>MINUTES</span>
            <span>SECONDS</span>
          </div>
        </div>
        <div class="birth-date">2026.09.15</div>
        <div class="son-title">
          <span>OUR SON</span>
          <span>WAS BORN</span>
        </div>
      </div>
    </main>
    <script src="birth.js"></script>
