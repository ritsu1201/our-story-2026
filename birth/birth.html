<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIRTH | Our Story</title>
    <link rel="stylesheet" href="birth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="birth">
      <div class="birth-content">
        <div class="and-then">AND THEN...</div>

        <div class="counter">
          <div class="time">00 : 00 : 00</div>
          <div class="labels">
            <span>HOURS</span>
            <span>MINUTES</span>
            <span>SECONDS</span>
          </div>
        </div>
        <div class="birth-date">2026.09.15</div>
        <div class="son-title">
          <div class="son-line">
            <span>OUR</span>
            <span>SON</span>
          </div>
          <div class="son-line">
            <span>WAS</span>
            <span>BORN</span>
          </div>
        </div>
      </div>
      <div class="birth-photo">
        <img src="../images/音叶くん.jpg" class="son-photo" alt="Our son" />
      </div>
      <div class="welcome">
        <div class="welcome-line1"></div>
        <div class="welcome-line2"></div>
      </div>
      <div class="since-birth">
        <p class="since-text">生まれてから</p>
        <div class="birth-time-item">
          <span class="time-number days-number">0</span>
          <span class="time-label">DAYS</span>
        </div>
        <div class="birth-time-item">
          <span class="time-number hours-number">0</span>
          <span class="time-label">HOURS</span>
        </div>
        <div class="birth-time-item">
          <span class="time-number minutes-number">0</span>
          <span class="time-label">MINUTES</span>
        </div>
        <div class="birth-time-item">
          <span class="time-number seconds-number">0</span>
          <span class="time-label">SECONDS</span>
        </div>
      </div>
      <div class="scroll-button">
        <span>SCROLL</span>
        <span class="scroll-arrow">﹀</span>
      </div>
      <section class="birth-profile">
        <div class="profile-photo">
          <img src="../images/音叶くん2.jpg" alt="音叶くん" />
        </div>
        <div class="profile-info">
          <h2>- profile -</h2>
          <p>BIRTHDAY</p>
          <p>2026.09.15</p>
          <p>BIRTH WEIGHT</p>
          <p>3042 g</p>
          <p>HEIGHT</p>
          <p>50 cm</p>
        </div>
      </section>
    </main>
    <script src="birth.js"></script>
  </body>
</html>
